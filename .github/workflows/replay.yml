name: Exact replay and release consistency

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system preflight dependency
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install exact package dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Ordinary exact replay
        run: ./scripts/reproduce.sh
      - name: Optimized exact replay
        run: PYTHONOPTIMIZE=2 ./scripts/reproduce.sh
